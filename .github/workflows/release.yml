name: Signed release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-release
  cancel-in-progress: false

jobs:
  release:
    name: Sign and notarize · Apple Silicon
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    environment: release
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check release configuration
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APP_PROFILE_BASE64: ${{ secrets.APP_PROFILE_BASE64 }}
          EXTENSION_PROFILE_BASE64: ${{ secrets.EXTENSION_PROFILE_BASE64 }}
          NOTARY_API_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          test "$(uname -m)" = arm64
          python3 - <<'PY'
          import os
          required = ['APPLE_TEAM_ID', 'DEVELOPER_ID_P12_BASE64', 'DEVELOPER_ID_P12_PASSWORD',
                      'APP_PROFILE_BASE64', 'EXTENSION_PROFILE_BASE64', 'NOTARY_API_KEY_BASE64',
                      'NOTARY_KEY_ID', 'NOTARY_ISSUER_ID']
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit('Configure the release environment: ' + ', '.join(missing))
          PY
          xcodebuild -version
          swift --version

      - name: Test code and launcher
        run: |
          set -o pipefail
          mkdir -p build/release-logs
          swift test --force-resolved-versions 2>&1 | tee build/release-logs/tests.log
          python3 Tests/Launcher/test_launcher.py
          python3 -B Tests/CI/test_signing.py
          python3 -B Tests/CI/test_sign_local.py

      - name: Install signing credentials
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APP_PROFILE_BASE64: ${{ secrets.APP_PROFILE_BASE64 }}
          EXTENSION_PROFILE_BASE64: ${{ secrets.EXTENSION_PROFILE_BASE64 }}
          NOTARY_API_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_BASE64 }}
        run: |
          python3 Scripts/ci/signing.py prepare
          keychain="$RUNNER_TEMP/setoken-signing/signing.keychain-db"
          keychain_password=$(openssl rand -hex 32)
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/setoken-signing/certificate.p12" \
            -P "$DEVELOPER_ID_P12_PASSWORD" -t cert -f pkcs12 -k "$keychain" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          security find-identity -v -p codesigning "$keychain" | grep -q 'Developer ID Application:'

      - name: Archive and export Developer ID app
        run: |
          set -o pipefail
          xcodebuild -project SecureEnclaveToken.xcodeproj -scheme SecureEnclaveToken \
            -configuration Release -destination 'generic/platform=macOS' \
            -archivePath build/SecureEnclaveToken.xcarchive -derivedDataPath build/DerivedData \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile \
            ARCHS=arm64 DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Developer ID Application' \
            SETOKEN_APP_PROFILE="$SETOKEN_APP_PROFILE" \
            SETOKEN_EXTENSION_PROFILE="$SETOKEN_EXTENSION_PROFILE" \
            archive \
            2>&1 | tee build/release-logs/archive.log
          xcodebuild -exportArchive -archivePath build/SecureEnclaveToken.xcarchive \
            -exportPath build/export -exportOptionsPlist "$RUNNER_TEMP/setoken-signing/ExportOptions.plist" \
            2>&1 | tee build/release-logs/export.log

      - name: Verify distribution signatures and entitlements
        run: |
          app=build/export/SecureEnclaveToken.app
          extension="$app/Contents/PlugIns/SecureEnclaveTokenExtension.appex"
          for bundle in "$app" "$extension"; do
            codesign --verify --strict --verbose=2 "$bundle"
            codesign -dv --verbose=4 "$bundle" 2> build/release-logs/signature.txt
            grep -q '^Authority=Developer ID Application:' build/release-logs/signature.txt
            grep -q "^TeamIdentifier=$APPLE_TEAM_ID$" build/release-logs/signature.txt
            grep -q 'flags=.*runtime' build/release-logs/signature.txt
            grep -q '^Timestamp=' build/release-logs/signature.txt
            test -f "$bundle/Contents/embedded.provisionprofile"
            codesign -d --entitlements :- "$bundle" > "$RUNNER_TEMP/setoken-signing/entitlements.plist"
            python3 - <<'PY'
          import os, plistlib
          from pathlib import Path
          e = plistlib.loads((Path(os.environ['RUNNER_TEMP']) / 'setoken-signing/entitlements.plist').read_bytes())
          assert not e.get('com.apple.security.get-task-allow') and not e.get('get-task-allow')
          assert e.get('com.apple.security.app-sandbox') is True
          assert os.environ['SETOKEN_KEYCHAIN_GROUP'] in e.get('keychain-access-groups', [])
          PY
          done
          codesign --verify --deep --strict --verbose=2 "$app"
          test "$(lipo -archs "$app/Contents/MacOS/SecureEnclaveToken")" = arm64
          test "$(lipo -archs "$extension/Contents/MacOS/SecureEnclaveTokenExtension")" = arm64
          "$app/Contents/MacOS/SecureEnclaveToken" cli --help
          ditto -c -k --sequesterRsrc --keepParent "$app" build/notarization.zip

      - name: Notarize
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set +e
          xcrun notarytool submit build/notarization.zip \
            --key "$RUNNER_TEMP/setoken-signing/notary.p8" \
            --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
            --wait --timeout 30m --output-format json > build/release-logs/notarization.json
          result=$?
          set -e
          submission_id=$(python3 -c 'import json; print(json.load(open("build/release-logs/notarization.json")).get("id", ""))')
          if [ -n "$submission_id" ]; then
            echo "Notarization submission: $submission_id"
            xcrun notarytool log "$submission_id" \
              --key "$RUNNER_TEMP/setoken-signing/notary.p8" \
              --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
              build/release-logs/notarization-log.json || true
          fi
          test "$result" = 0
          python3 - <<'PY'
          import json
          result = json.load(open('build/release-logs/notarization.json'))
          if result.get('status') != 'Accepted':
              raise SystemExit('Notarization not accepted; inspect the submission log before retrying.')
          PY

      - name: Staple and package
        run: |
          app=build/export/SecureEnclaveToken.app
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" build/SecureEnclaveToken-signed-arm64.zip
          cd build
          shasum -a 256 SecureEnclaveToken-signed-arm64.zip > SecureEnclaveToken-signed-arm64.zip.sha256

      - name: Upload signed and notarized app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SecureEnclaveToken-signed-arm64
          path: |
            build/SecureEnclaveToken-signed-arm64.zip
            build/SecureEnclaveToken-signed-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing credentials
        if: always()
        run: |
          keychain="$RUNNER_TEMP/setoken-signing/signing.keychain-db"
          cleanup_status=0
          if [ -f "$keychain" ]; then
            security delete-keychain "$keychain" || cleanup_status=$?
          fi
          python3 Scripts/ci/signing.py cleanup
          exit "$cleanup_status"

      - name: Upload release logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-logs
          path: build/release-logs/
          if-no-files-found: ignore
          retention-days: 14
